<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>أهلي نيوز</title>
<style>
body{font-family:Tahoma,Arial;margin:0;background:#f3f3f3;color:#151515}.wrap{max-width:1050px;margin:auto;padding:18px}header{background:linear-gradient(135deg,#d00000,#700000);color:#fff}.top{display:flex;justify-content:space-between;align-items:center}.logo{font-size:28px;font-weight:900}button{border:0;border-radius:10px;padding:9px 13px;cursor:pointer;font-weight:bold}.admin{background:#fff;color:#a00000}.hero{margin:20px 0;background:linear-gradient(135deg,#111,#b00000);color:#fff;border-radius:22px;padding:30px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:#fff;border-radius:16px;padding:15px;box-shadow:0 4px 15px #0001}.card img{width:100%;height:150px;object-fit:cover;border-radius:12px}.muted{color:#777;font-size:13px}.panel{background:#fff;border-radius:18px;padding:18px;margin:18px 0}.panel input,.panel textarea,.panel select{width:100%;padding:11px;margin:6px 0 12px;border:1px solid #ddd;border-radius:10px;font-family:inherit}.red{background:#c40000;color:white}.danger{background:#eee;color:#b00000}.hidden{display:none}.tabs button{margin:3px}.msg{padding:8px;color:#a00000}@media(max-width:750px){.grid{grid-template-columns:1fr}.logo{font-size:22px}}
</style></head><body>
<header><div class="wrap top"><div class="logo">🔴 أهلي نيوز 🦅</div><button class="admin" onclick="showAdmin()">⚙️ Admin</button></div></header>
<main class="wrap"><section class="hero"><h1>أخبار الأهلي أولاً بأول</h1><p>الأخبار والانتقالات التي تضيفها من لوحة التحكم تظهر هنا تلقائياً.</p></section>
<section><h2>📰 الأخبار</h2><div id="news" class="grid"></div></section>
<section><h2>🔄 الانتقالات</h2><div id="transfers" class="grid"></div></section>
<section id="admin" class="panel hidden"><h2>⚙️ لوحة التحكم</h2><div id="login"><input id="pass" type="password" placeholder="كلمة مرور Admin"><button class="red" onclick="login()">دخول</button><div id="msg"></div></div>
<div id="dash" class="hidden"><div class="tabs"><button class="red" onclick="form('news')">➕ إضافة خبر</button><button class="red" onclick="form('transfer')">🔄 إضافة انتقال</button><button onclick="loadAdmin()">🔃 تحديث</button></div>
<div id="form"></div><hr><div id="adminList"></div></div></section></main>
<script>
let token=localStorage.getItem("ahli_admin_token")||"";
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function showAdmin(){document.getElementById("admin").classList.remove("hidden");document.getElementById("admin").scrollIntoView({behavior:"smooth"});if(token){document.getElementById("login").classList.add("hidden");document.getElementById("dash").classList.remove("hidden");loadAdmin()}}
async function login(){let p=document.getElementById("pass").value,r=await fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:p})});let d=await r.json();if(!r.ok){msg.textContent=d.error;return}token=d.token;localStorage.setItem("ahli_admin_token",token);showAdmin()}
function form(type){let f=document.getElementById("form");f.innerHTML=type==="news"?`<h3>إضافة خبر</h3><input id="title" placeholder="عنوان الخبر"><textarea id="body" rows="4" placeholder="محتوى مختصر"></textarea><input id="image" type="file" accept="image/*"><button class="red" onclick="addNews()">نشر الخبر</button>`:`<h3>إضافة انتقال</h3><input id="player" placeholder="اسم اللاعب"><select id="type"><option value="in">⬅️ قادم للأهلي</option><option value="out">➡️ مغادر</option></select><input id="details" placeholder="التفاصيل"><input id="image" type="file" accept="image/*"><button class="red" onclick="addTransfer()">إضافة الانتقال</button>`}
async function addNews(){let fd=new FormData();fd.append("title",title.value);fd.append("body",body.value);if(image.files[0])fd.append("image",image.files[0]);await post("/api/news",fd);form("news");loadAdmin();loadPublic()}
async function addTransfer(){let fd=new FormData();fd.append("player",player.value);fd.append("type",type.value);fd.append("details",details.value);if(image.files[0])fd.append("image",image.files[0]);await post("/api/transfers",fd);form("transfer");loadAdmin();loadPublic()}
async function post(url,body){let r=await fetch(url,{method:"POST",headers:{"Authorization":"Bearer "+token},body});if(!r.ok)alert("حدث خطأ أو انتهت الجلسة")}
async function del(kind,id){if(!confirm("حذف العنصر؟"))return;await fetch("/api/"+kind+"/"+id,{method:"DELETE",headers:{"Authorization":"Bearer "+token}});loadAdmin();loadPublic()}
async function loadAdmin(){let d=await fetch("/api/content").then(r=>r.json());adminList.innerHTML="<h3>المحتوى المنشور</h3>"+d.news.map(x=>`<div class="card"><b>📰 ${esc(x.title)}</b> <button class="danger" onclick="del('news','${x.id}')">حذف</button></div>`).join("")+d.transfers.map(x=>`<div class="card"><b>🔄 ${esc(x.player)}</b> <button class="danger" onclick="del('transfers','${x.id}')">حذف</button></div>`).join("")}
async function loadPublic(){let d=await fetch("/api/public").then(r=>r.json());news.innerHTML=d.news.map(x=>`<article class="card">${x.image?`<img src="${esc(x.image)}">`:""}<h3>${esc(x.title)}</h3><p>${esc(x.body)}</p><div class="muted">${new Date(x.date).toLocaleString("ar-EG")}</div></article>`).join("")||"<p>لا توجد أخبار بعد.</p>";transfers.innerHTML=d.transfers.map(x=>`<article class="card"><h3>${x.type==="in"?"⬅️":"➡️"} ${esc(x.player)}</h3><p>${esc(x.details)}</p></article>`).join("")||"<p>لا توجد انتقالات بعد.</p>"}
loadPublic();setInterval(loadPublic,60000);
</script></body></html>
